server:
  port: 8080
spring:
  application:
    name: "LoanApplicationApi"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  jackson:
    default-property-inclusion: "non_null"
    property-naming-strategy: "SNAKE_CASE"
adapters:
  r2dbc:
    host: "${R2DBC_HOST}"
    port: "${R2DBC_PORT}"
    database: "${R2DBC_DATABASE}"
    schema: "${R2DBC_SCHEMA}"
    username: "${R2DBC_USERNAME}"
    password: "${R2DBC_PASSWORD}"
routes:
  paths:
    loan-application:
      register: "/api/v1/solicitudes"
      manual-validation-application-report: "/api/v1/solicitudes/reporte-validacion-manual"
      approve-or-reject-loan-application: "/api/v1/solicitudes/{id}/decision"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
  health:
    circuitbreakers:
      enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
jwt:
  secret: "${JWT_SECRET}"
adapter:
  sqs:
    region: "${SQS_REGION}"
    processedLoanApplicationsQueueUrl: "${SQS_PROCESSED_LOAN_APPLICATIONS_QUEUE_URL}"
    debtCapacityCalculationQueueUrl: "${SQS_DEBT_CAPACITY_CALCULATION_QUEUE_URL}"
    processedAutomaticValidationLoanApplicationsQueueUrl: "${SQS_PROCESSED_AUTOMATIC_VALIDATION_LOAN_APPLICATIONS_QUEUE_URL}"
    acceptedLoanApplicationsQueueUrl: "${SQS_ACCEPTED_LOAN_APPLICATIONS_QUEUE_URL}"
    endpoint: "${SQS_ENDPOINT}"
  restconsumer:
    timeout: 5000
    url: "${AUTH_SERVICE_URL}"
resilience4j:
  circuitbreaker:
    instances:
      authServiceFindByEmail:
        registerHealthIndicator: true
        failureRateThreshold: 50
        slowCallRateThreshold: 50
        slowCallDurationThreshold: "2s"
        permittedNumberOfCallsInHalfOpenState: 3
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        waitDurationInOpenState: "10s"
entrypoint:
  sqs:
    region: "${SQS_REGION}"
    endpoint: "${SQS_ENDPOINT}"
    queueUrl: "${SQS_AUTOMATIC_VALIDATION_LOAN_APPLICATIONS_RESULTS_QUEUE_URL}"
    waitTimeSeconds: 20
    maxNumberOfMessages: 10
    visibilityTimeoutSeconds: 10
    numberOfThreads: 1
