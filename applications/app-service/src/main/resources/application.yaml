server:
  port: 8080
spring:
  application:
    name: "LoanApplicationApi"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
  jackson:
    default-property-inclusion: "non_null"
    property-naming-strategy: "SNAKE_CASE"
adapters:
  r2dbc:
    host: "${R2DBC_HOST}"
    port: "${R2DBC_PORT}"
    database: "${R2DBC_DATABASE}"
    schema: "${R2DBC_SCHEMA}"
    username: "${R2DBC_USERNAME}"
    password: "${R2DBC_PASSWORD}"
routes:
  paths:
    loan-application:
      register: "/api/v1/solicitudes"
      manual-validation-application-report: "/api/v1/solicitudes/reporte-validacion-manual"
      approve-or-reject-loan-application: "/api/v1/solicitudes/{id}/decision"
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"
jwt:
  secret: "${JWT_SECRET}"
adapter:
  sqs:
    region: "${SQS_REGION}"
    queueUrl: "${SQS_QUEUE_URL}"
    endpoint: "${SQS_ENDPOINT}"
